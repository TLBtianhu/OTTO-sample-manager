name: Publish Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Type check main
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Type check renderer
        run: npx tsc --noEmit -p tsconfig.web.json
      - name: Build legacy Electron artifacts
        run: npm run pack -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: otto-electron-legacy-${{ github.sha }}
          path: ../sample-manager-release/*
