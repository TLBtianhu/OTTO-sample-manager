name: Tauri Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish, for example v2.6.4
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
      - tauri
      - codex/tauri-windows-migration
    tags:
      - 'v*'

jobs:
  verify-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: TypeScript
        run: npm run check:types

      - name: React and Electron tests
        run: npm test

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build unsigned-check NSIS package
        run: npm run tauri:build -- --ci

      - name: Enforce release artifact contract
        run: npm run tauri:verify:release

      - name: Enforce installer size target
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated' }
          if ($installer.Length -gt 30MB) { throw "Installer is $([math]::Round($installer.Length / 1MB, 2)) MiB; target is 30 MiB" }
          "NSIS size: $([math]::Round($installer.Length / 1MB, 2)) MiB"

      - uses: actions/upload-artifact@v4
        with:
          name: otto-tauri-nsis-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe

  signed-release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/tauri' && startsWith(github.event.head_commit.message, 'release:'))
    needs: verify-windows
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v2.6.4' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Validate release tag and version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match package version $version"
          }
          git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG"

      - name: Build signed Tauri release
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY repository secret is missing'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secret is missing'
          }
          if ($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -match '[\r\n]') {
            throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secret contains a trailing newline'
          }
          try {
            [void][Convert]::FromBase64String($env:TAURI_SIGNING_PRIVATE_KEY)
          } catch {
            throw 'TAURI_SIGNING_PRIVATE_KEY repository secret is not the raw Base64 key file content'
          }
          npm run tauri:build:release -- --ci

      - name: Generate Electron and Tauri update manifests
        run: npm run tauri:manifests:release

      - name: Verify final update artifacts
        run: npm run tauri:verify:update-artifacts

      - name: Upload compatibility release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (gh release view $env:RELEASE_TAG 2>$null)) {
            gh release create $env:RELEASE_TAG `
              --title "OTTO Sample Manager $env:RELEASE_TAG" `
              --notes "修复文件夹导入后分类根目录消失、层级错位及默认展开全部音频的问题。" `
              --draft
          }
          gh release upload $env:RELEASE_TAG `
            release/2.6.4/_2.6.4_x64-setup.exe `
            release/2.6.4/_2.6.4_x64-setup.exe.sig `
            release/2.6.4/latest.json `
            release/2.6.4/latest.yml `
            --clobber

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit $env:RELEASE_TAG --draft=false --latest
